<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLOUDD — Backend</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: https://bmrhejmutccvjzijuqae.supabase.co; connect-src 'self' https://bmrhejmutccvjzijuqae.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<script>if (top !== self) top.location = self.location;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --sky:#4fb3ff; --sky-deep:#1b4b8f; --night:#071224;
  --foil:#c9d2da; --ink:#0c1a28; --raised:#f2f8fd;
  --hair:rgba(255,255,255,.14); --panel:rgba(214,228,240,.06);
  --bad:#ff6b6b; --good:#5fe3a1;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--raised);font-family:var(--f-display);min-height:100%}
body{min-height:100vh}
#chrome{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:linear-gradient(160deg,#132d55,#0b1a30 45%,#061020 70%,#1c3a63)}
a{color:var(--sky)}
.mono{font-family:var(--f-mono)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,36px)}

/* ---------- login screen ---------- */
#login{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{
  width:100%;max-width:380px;background:rgba(7,18,36,.42);backdrop-filter:blur(14px);
  border:1px solid var(--hair);border-radius:16px;padding:clamp(24px,4vw,34px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand .mark{width:44px;flex:none}
.brand .mark img{width:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.brand .sub{font-size:11px;color:var(--foil);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--foil);margin-bottom:6px}
.field input{
  width:100%;padding:12px 13px;border-radius:9px;border:1px solid var(--hair);
  background:rgba(7,18,36,.55);color:var(--raised);font:14px var(--f-display);outline:none;
}
.field input:focus{border-color:var(--sky)}
button.go{
  width:100%;margin-top:6px;padding:13px;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(160deg,var(--sky),var(--sky-deep));color:#061020;font-weight:700;font-size:14px;
  letter-spacing:.02em;transition:filter .15s;
}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:1px}

/* ---------- dashboard ---------- */
#dash{display:none}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--hair);
}
header.top .who{font-size:12px;color:var(--foil)}
.stat,.tablewrap,header.top,.tab{backdrop-filter:blur(10px)}
.stat{background:rgba(214,228,240,.07)}
.tablewrap{background:rgba(7,18,36,.42)}
button.ghost{
  background:transparent;border:1px solid var(--hair);color:var(--raised);
  padding:8px 14px;border-radius:8px;font:12.5px var(--f-mono);cursor:pointer;letter-spacing:.03em;
}
button.ghost:hover{border-color:var(--sky);color:var(--sky)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:16px}
.stat .n{font-size:28px;font-weight:800}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--foil);margin-top:2px}

.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{
  background:transparent;border:1px solid var(--hair);color:var(--foil);
  padding:9px 16px;border-radius:999px;font:12.5px var(--f-mono);cursor:pointer;letter-spacing:.03em;
}
.tab.active{background:var(--sky);color:#061020;border-color:var(--sky);font-weight:600}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{
  flex:1;min-width:180px;padding:10px 13px;border-radius:9px;border:1px solid var(--hair);
  background:rgba(7,18,36,.55);color:var(--raised);font:13px var(--f-display);outline:none;
}
.toolbar input[type=search]:focus{border-color:var(--sky)}

.tablewrap{overflow-x:auto;border:1px solid var(--hair);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
thead th{
  text-align:left;padding:11px 14px;font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--foil);border-bottom:1px solid var(--hair);background:rgba(255,255,255,.02);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font:11px var(--f-mono);letter-spacing:.03em}
.pill.yes{background:rgba(95,227,161,.14);color:var(--good)}
.pill.no{background:rgba(255,255,255,.07);color:var(--foil)}
.pill.paid{background:rgba(95,227,161,.14);color:var(--good)}
.pill.pending{background:rgba(255,196,0,.14);color:#ffc400}
.pill.cancelled,.pill.refunded{background:rgba(255,107,107,.14);color:var(--bad)}
.thumb{width:30px;height:30px;border-radius:7px;object-fit:cover;background:rgba(255,255,255,.06);display:block}
.empty{padding:50px 20px;text-align:center;color:var(--foil);font-size:13px}
.empty .big{font-size:15px;color:var(--raised);margin-bottom:6px;font-weight:600}
.muted{color:var(--foil)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--foil)}
code.k{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:5px;font-size:11px}
</style>
</head>
<body>

<canvas id="chrome" aria-hidden="true"></canvas>
<div id="login">
  <div class="card">
    <div class="brand">
      <div class="mark"><img src="cloudd-logo.webp" alt="CLOUDD"></div>
      <div class="sub">Backend</div>
    </div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="go" type="submit" id="goBtn">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="dash">
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark"><img src="cloudd-logo.webp" alt="CLOUDD"></div>
        <div class="sub">Backend</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="who mono" id="whoami"></span>
        <button class="ghost" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab active" data-tab="list">Cloud List</button>
      <button class="tab" data-tab="tickets">Tickets</button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, email, WhatsApp…">
      <button class="ghost" id="refreshBtn">Refresh</button>
      <button class="ghost" id="exportBtn">Export CSV</button>
    </div>

    <div class="tablewrap">
      <table id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="emptyState" style="display:none" class="empty"></div>
    <div class="foot"><span id="countLabel"></span><span class="mono">clouddsessions.com /admin</span></div>
  </div>
</div>

<script>
(function chrome(){
  const c = document.getElementById("chrome");
  const gl = c.getContext("webgl", { antialias:false, premultipliedAlpha:false });
  if (!gl) return;
  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs = `
  precision highp float;
  uniform vec2 R; uniform float T;
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<4;i++){v+=a*n2(p);p=m*p;a*=.5;}return v;}
  float H(vec2 p){
    float t=T*.025; vec2 o=p; p*=.32;
    vec2 q=vec2(fbm(p+vec2(0.,t)),fbm(p+vec2(5.2,-t)));
    float h=fbm(p*1.1+q*1.4+vec2(t*.6,0.));
    return h;
  }
  vec3 env(vec3 r){
    float y=r.y, x=r.x;
    vec3 skyTop=vec3(.16,.27,.46), sky=vec3(.07,.19,.40), deep=vec3(.02,.06,.16);
    vec3 grey=vec3(.09,.13,.21), dark=vec3(.015,.03,.08), white=vec3(.55,.76,1.);
    vec3 c=mix(deep,sky,smoothstep(-.6,.1,y));
    c=mix(c,skyTop,smoothstep(.15,.7,y));
    c=mix(c,dark,smoothstep(.06,.0,abs(y+.18))*.85);
    c=mix(c,white,smoothstep(.035,.0,abs(y-.42))*.9);
    c=mix(c,white,smoothstep(.05,.0,abs(x+.5+.15*y))*.55);
    vec3 g=mix(dark,white,smoothstep(-.7,.8,y+.25*x));
    g=mix(g,grey,.35);
    return mix(g,c,.38);
  }
  void main(){
    vec2 uv=gl_FragCoord.xy/R; vec2 p=vec2(uv.x*R.x/R.y,1.-uv.y);
    float e=3./R.y;
    float h=H(p);
    float hx=H(p+vec2(e,0.))-h, hy=H(p+vec2(0.,e))-h;
    vec2 g1=floor(gl_FragCoord.xy), g2=floor(gl_FragCoord.xy*.5);
    float ga=h21(g1)-.5, gb=h21(g1+17.)-.5, gc=h21(g2+5.)-.5;
    vec3 n=normalize(vec3(-hx*1.5+ga*e*.03, hy*1.5+gb*e*.03, e));
    vec3 v=vec3(0.,0.,1.);
    vec3 r=reflect(-v,n);
    vec3 col=env(r);
    col=mix(col,vec3(.02,.05,.14),.6);
    float lum=dot(col,vec3(.3,.6,.1));
    col+=(ga*.03+gc*.018)*(.45+lum);
    float vig=smoothstep(1.4,.3,length(uv-.5));
    col*=mix(.80,1.,vig);
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,"R"),uT=gl.getUniformLocation(pr,"T");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SCALE = .8;
  function size(){
    const d=Math.min(devicePixelRatio||1,2)*SCALE;
    c.width=Math.max(2,Math.round(innerWidth*d)); c.height=Math.max(2,Math.round(innerHeight*d));
    gl.viewport(0,0,c.width,c.height);
  }
  size(); addEventListener("resize",size);
  const t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    gl.uniform2f(uR,c.width,c.height); gl.uniform1f(uT,reduce?8:t+8);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CONFIG = {
  supabaseUrl: "https://bmrhejmutccvjzijuqae.supabase.co",
  supabaseAnonKey: "sb_publishable_4bBsCXlf8p8VlFGPB0D7KQ_UTl3yO-U",
};
const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});

let currentTab = "list";
let rowsCache = { list: [], tickets: [] };

const $ = s => document.querySelector(s);

function showDash(session, username){
  $("#login").style.display = "none";
  $("#dash").style.display = "block";
  $("#whoami").textContent = username || session.user.email;
  loadTab("list");
}
function showLogin(){
  $("#dash").style.display = "none";
  $("#login").style.display = "flex";
}

(async function init(){
  const { data } = await sb.auth.getSession();
  if (data.session) showDash(data.session);
})();

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#goBtn"); btn.disabled = true; btn.textContent = "Signing in…";
  $("#loginErr").textContent = "";
  const username = $("#username").value.trim();
  const password = $("#password").value;

  try {
    const { data: email, error: lookupErr } = await sb.rpc("resolve_admin_email", { p_username: username });
    if (lookupErr){
      btn.disabled = false; btn.textContent = "Sign in";
      $("#loginErr").textContent = "Lookup error: " + lookupErr.message;
      return;
    }
    if (!email){
      btn.disabled = false; btn.textContent = "Sign in";
      $("#loginErr").textContent = "Wrong username or password.";
      return;
    }

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Sign in";
    if (error){ $("#loginErr").textContent = "Auth error: " + error.message; return; }
    showDash(data.session, username);
  } catch (ex) {
    btn.disabled = false; btn.textContent = "Sign in";
    $("#loginErr").textContent = "Script error: " + ex.message;
  }
});

$("#signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  showLogin();
});

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  loadTab(t.dataset.tab);
}));

$("#refreshBtn").addEventListener("click", () => loadTab(currentTab, true));
$("#search").addEventListener("input", () => render(currentTab));
$("#exportBtn").addEventListener("click", () => exportCsv(currentTab));

async function loadTab(tab, force){
  currentTab = tab;
  if (!force && rowsCache[tab].length) { render(tab); return; }
  $("#tbody").innerHTML = `<tr><td colspan="8" class="muted">Loading…</td></tr>`;
  $("#emptyState").style.display = "none";

  if (tab === "list"){
    const { data, error } = await sb.from("rsvps")
      .select("pass_no, first_name, email, whatsapp, instagram, photo_path, show_on_wall, notified_at, created_at")
      .order("created_at", { ascending: false });
    rowsCache.list = error ? [] : data;
  } else {
    const { data, error } = await sb.from("tickets")
      .select("ticket_no, full_name, email, whatsapp, ticket_type, amount, currency, status, purchased_at, created_at")
      .order("created_at", { ascending: false });
    rowsCache.tickets = error ? [] : data;
  }
  renderStats();
  render(tab);
}

function renderStats(){
  const list = rowsCache.list, tk = rowsCache.tickets;
  const paid = tk.filter(t => t.status === "paid");
  $("#stats").innerHTML = `
    <div class="stat"><div class="n">${list.length}</div><div class="l">On the cloud list</div></div>
    <div class="stat"><div class="n">${list.filter(r=>r.photo_path).length}</div><div class="l">On the wall of faces</div></div>
    <div class="stat"><div class="n">${tk.length}</div><div class="l">Tickets total</div></div>
    <div class="stat"><div class="n">${paid.length}</div><div class="l">Tickets paid</div></div>
  `;
}

function render(tab){
  const q = $("#search").value.trim().toLowerCase();
  const rows = (rowsCache[tab] || []).filter(r => {
    if (!q) return true;
    return Object.values(r).some(v => String(v ?? "").toLowerCase().includes(q));
  });

  if (tab === "list"){
    $("#thead").innerHTML = `<tr><th>#</th><th>Photo</th><th>Name</th><th>Email</th><th>WhatsApp</th><th>Instagram</th><th>On wall</th><th>Joined</th></tr>`;
    if (!rows.length){ emptyMsg("No one on the cloud list yet", "Signups from the RSVP form will show up here."); return; }
    hideEmpty();
    $("#tbody").innerHTML = rows.map(r => `
      <tr>
        <td class="mono">${r.pass_no}</td>
        <td>${r.photo_path ? `<img class="thumb" src="${esc(CONFIG.supabaseUrl + "/storage/v1/object/public/faces/" + r.photo_path)}" loading="lazy">` : `<div class="thumb"></div>`}</td>
        <td>${esc(r.first_name)}</td>
        <td class="mono">${esc(r.email)}</td>
        <td class="mono">${esc(r.whatsapp || "—")}</td>
        <td class="mono">${esc(r.instagram || "—")}</td>
        <td><span class="pill ${r.show_on_wall ? 'yes' : 'no'}">${r.show_on_wall ? "Yes" : "No"}</span></td>
        <td class="muted">${fmtDate(r.created_at)}</td>
      </tr>
    `).join("");
  } else {
    $("#thead").innerHTML = `<tr><th>#</th><th>Name</th><th>Email</th><th>WhatsApp</th><th>Type</th><th>Amount</th><th>Status</th><th>Purchased</th></tr>`;
    if (!rows.length){ emptyMsg("No tickets sold yet", "Once ticket sales go live and write into the tickets table, they'll show up here."); return; }
    hideEmpty();
    $("#tbody").innerHTML = rows.map(r => `
      <tr>
        <td class="mono">${r.ticket_no}</td>
        <td>${esc(r.full_name)}</td>
        <td class="mono">${esc(r.email)}</td>
        <td class="mono">${esc(r.whatsapp || "—")}</td>
        <td>${esc(r.ticket_type)}</td>
        <td class="mono">${r.amount ? `${r.currency} ${r.amount}` : "—"}</td>
        <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td>
        <td class="muted">${r.purchased_at ? fmtDate(r.purchased_at) : "—"}</td>
      </tr>
    `).join("");
  }
  $("#countLabel").textContent = `${rows.length} shown · ${rowsCache[tab].length} total`;
}

function emptyMsg(big, small){
  $("#tbody").innerHTML = "";
  $("#table").style.display = "none";
  $("#emptyState").style.display = "block";
  $("#emptyState").innerHTML = `<div class="big">${big}</div><div>${small}</div>`;
  $("#countLabel").textContent = "";
}
function hideEmpty(){
  $("#table").style.display = "table";
  $("#emptyState").style.display = "none";
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + " · " + dt.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }

function exportCsv(tab){
  const rows = rowsCache[tab] || [];
  if (!rows.length) return;
  const cols = Object.keys(rows[0]);
  const csvCell = v => {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise formula injection when opened in Excel/Sheets
    return `"${s.replace(/"/g,'""')}"`;
  };
  const csv = [cols.join(",")].concat(
    rows.map(r => cols.map(c => csvCell(r[c])).join(","))
  ).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `cloudd-${tab}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body></html>
